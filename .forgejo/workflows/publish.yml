# Builds the fork and publishes @lineto/fontkit to the lineto npm registry on
# Forgejo. Runs when package.json changes on the `lineto` branch.
name: Publish

on:
  push:
    branches: [lineto]
    paths: [package.json]

env:
  REGISTRY: https://git.lineto.com/api/packages/lineto/npm/

jobs:
  publish:
    runs-on: docker
    container: node:22
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build
      # The repo keeps upstream's name, which its tests import by:
      - run: npm pkg set name=@lineto/fontkit
      # The automatic token has no access to the org's packages.
      - run: npm config set "${REGISTRY#https:}:_authToken" "${{ secrets.LINETO_NPM_TOKEN }}"
      # package.json also changes for dependency updates, so only publish a new
      # version:
      - run: |
          if npm view --@lineto:registry="$REGISTRY" "@lineto/fontkit@$(npm pkg get version | tr -d '"')" version > /dev/null 2>&1; then
            echo "Version already published, skipping"
          else
            npm publish
          fi
